# Manual, append-only Windows assets for the EXISTING latest release. No new tag/release, no Mac asset replacement.
# Keep this workflow's filename so it remains dispatchable on the Windows port branch before merging that branch.
name: Windows release asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing latest tag (blank means v + package.json version)
        required: false
        default: ""
      publish:
        description: Append the verified unsigned Windows preview to that release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-asset-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mac-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install ripgrep
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    needs: mac-regression
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_RELEASE_TAG: ${{ inputs.release_tag }}
      # Hosted Windows runners can create file symlinks; do not silently lose that security coverage.
      PIGNA_REQUIRE_FILE_SYMLINKS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: choco install ripgrep --no-progress -y
      - run: pnpm install --frozen-lockfile
      - name: Verify existing release and published source
        run: node scripts/windows-release.mjs check
      - run: pnpm typecheck
      # Never publish a tolerated-red suite. Platform-specific skips have explicit native counterparts.
      - run: pnpm test
      - run: pnpm dist:win
      - name: Packaged application smoke (isolated fake pi)
        run: node scripts/verify-windows-preview.mjs dist/win-unpacked/pi-gna.exe
      - name: Fresh install, reinstall, uninstall and profile preservation
        run: node scripts/verify-windows-installer.mjs
      - name: Prepare source provenance and checksums
        run: node scripts/windows-release.mjs prepare
      - name: Keep the verified artifacts for review
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            dist/pi-gna-setup-x64.exe
            dist/pi-gna-windows-x64-build.json
            dist/pi-gna-windows-x64.sha256
            dist/pi-gna-windows-x64-notes.md
          if-no-files-found: error
      - name: Append Windows only (no clobber, no retag)
        if: ${{ inputs.publish }}
        env:
          WINDOWS_PUBLISH_VERIFIED: "1"
        run: node scripts/windows-release.mjs publish
