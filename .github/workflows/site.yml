name: Site

# Builds site/ and deploys it to pi-gna.com (Cloudflare Workers static assets).
# The changelog and download pages read CHANGELOG.md, so pushing a release redeploys the site too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
