name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests run real git, python3 and rg (ATP's plan scan); the runner image has no ripgrep.
      - run: sudo apt-get install -y ripgrep
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
