# `pnpm release <patch|minor|major>` commits the bump and tags it; pushing the tag publishes a release with arm64
# and x64 dmgs and the version's CHANGELOG.md entries as its notes. Builds are ad-hoc signed and not notarized
# (see docs/DESIGN.md, Packaging and release).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the Computer Use helper
        run: |
          pnpm build:computer-use
          codesign --verify --deep --strict "build/computer-use/pi-gna Computer Use.app"
          lipo -archs "build/computer-use/pi-gna Computer Use.app/Contents/MacOS/"* | grep -q arm64
      - run: pnpm dist
      - name: Helper is packaged and signed
        run: |
          for app in dist/mac-arm64/*.app dist/mac/*.app; do
            [ -d "$app" ] || continue
            helper="$app/Contents/Resources/computer-use/pi-gna Computer Use.app"
            test -d "$helper" || { echo "helper missing from $app"; exit 1; }
            codesign --verify --deep --strict "$helper"
          done
          test -d dist/mac-arm64
      - name: Fuses
        run: pnpm dlx @electron/fuses read --app "$(ls -d dist/mac-arm64/*.app)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
