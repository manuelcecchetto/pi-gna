# `pnpm dist` packages the app into dist/ (a .dmg per architecture). The app name is package.json's productName.
appId: io.github.manuelcecchetto.pigna
copyright: Copyright © 2026 Manuel Cecchetto
directories:
  output: dist
  buildResources: build
# Everything the renderer needs is bundled by Vite, and main and preload only use Node and Electron, so the app
# ships no node_modules.
files:
  - out/**
  - resources/**
  - src/main/command.ts
  - src/shared/paths.ts
  - src/shared/browser.ts
  - src/shared/preview.ts
  - src/shared/board.ts
  - src/shared/ask.ts
  - src/shared/laments.ts
  - src/shared/threads.ts
  - src/shared/settings.ts
  - src/shared/themes.ts
  - src/shared/theme-presets.ts
  - src/shared/viewport.ts
  - src/shared/chat-title.ts
  - src/shared/file-mentions.ts
  - src/shared/fast.ts
  - src/shared/subagents.ts
  - "!resources/icon.png"
  - "!resources/icon.svg"
  - "!resources/pigna-flag.ts"
# pi and the Node helpers read these from disk, so every source file the extensions/helpers import
# must be listed here and under files: (scripts/packaging.test.mjs checks both).
asarUnpack:
  - resources/**
  - src/main/command.ts
  - src/shared/paths.ts
  - src/shared/browser.ts
  - src/shared/preview.ts
  - src/shared/board.ts
  - src/shared/ask.ts
  - src/shared/laments.ts
  - src/shared/threads.ts
  - src/shared/settings.ts
  - src/shared/themes.ts
  - src/shared/theme-presets.ts
  - src/shared/viewport.ts
  - src/shared/chat-title.ts
  - src/shared/file-mentions.ts
  - src/shared/fast.ts
  - src/shared/subagents.ts
electronLanguages: [en]
# Electron security checklist #19. Verify with `npx @electron/fuses read --app "dist/mac-arm64/<name>.app"`.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  icon: build/icon.icns
  # The Computer Use helper app (built by `pnpm build:computer-use`, which `pnpm dist` runs first) rides outside the
  # asar in Contents/Resources/computer-use/; main installs it to ~/.pi-gna and launches it from there.
  extraResources:
    - from: build/computer-use/pi-gna Computer Use.app
      to: computer-use/pi-gna Computer Use.app
  category: public.app-category.developer-tools
  # Dictation (Settings > Agent > Beta) records the microphone; macOS asks the first time with this line.
  extendInfo:
    NSMicrophoneUsageDescription: pi-gna uses the microphone for dictation in the composer and for voice calls. The audio is processed on this Mac and never leaves it.
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID certificate: ad-hoc signature, no notarization. The README explains the Gatekeeper prompt.
  identity: "-"
  hardenedRuntime: false
  # The Computer Use helper keeps the signature build-computer-use gave it (release.yml: the stable certificate that
  # macOS permission grants are tied to); re-signing it ad-hoc here would reset users' grants on every update.
  signIgnore:
    - /Contents/Resources/computer-use/
dmg:
  # Version-free names keep releases/latest/download/pi-gna-<arch>.dmg stable (the README's agent install), and
  # are the asset names the updater looks for (src/main/updater.ts).
  artifactName: ${name}-${arch}.${ext}
  format: ULFO
  # build/dmg-background.png (+ @2x) is drawn by `pnpm dmg-background` from build/dmg-art.webp: Pignas, an arrow, the text.
  # Window and icon positions must match scripts/make-dmg-background.mjs (it is 540x380, icons at x 140 and 400, y 140).
  background: build/dmg-background.png
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 140
    - x: 400
      y: 140
      type: link
      path: /Applications
  # pi-gna's updater downloads the whole dmg, so no .blockmap files.
  writeUpdateInfo: false
# Windows preview (docs/WINDOWS.md): unsigned per-user installer, appended to the existing release by
# .github/workflows/windows-beta.yml after native gates pass. No Windows updater or Computer Use yet.
# The original tag and Mac DMG assets stay unchanged; the Mac updater selects only its own DMG.
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-setup-${arch}.${ext}
  oneClick: true
  perMachine: false
